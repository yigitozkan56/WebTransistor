[package]
name = "puresilicon"
version = "1.0.0"
description = "PureSilicon — Saf Transistör Tabanlı Çip & Devre Simülatörü (GPU Accelerated)"
authors = ["PureSilicon Team"]
edition = "2021"

[lib]
name = "puresilicon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "24"
pollster = "0.2"
bytemuck = { version = "1", features = ["derive"] }
rayon = "1"
